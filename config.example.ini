; AnimationCrazy Video Downloader — 配置示例
; 用法：复制本文件为 config.ini 后按需修改（config.ini 已被 .gitignore 排除，不会提交）
; 修改后重新运行程序即可生效，无需重启。
[acdl]

; ===== 输出 =====
save_dir = downloads          ; 输出根目录（相对仓库或绝对路径）
video_ext = mp4              ; 封装格式：mp4 | mkv | ts（mp4/mkv 需要 ffmpeg）
zerofill = 2                 ; 集数补零位数，如 2 => 第01集
add_resolution = True        ; 文件名是否附加清晰度（如 "1080p"）

; ===== 下载 =====
thread_count = 8             ; 并发下载线程数
http_timeout = 100           ; 单段 HTTP 请求超时（秒）
download_retry = 3           ; 分片下载失败重试次数
max_speed =                    ; 限速，留空不限速，如 15M / 2000K

; ===== 批量 =====
cooldown = 3                 ; 每集之间的冷却秒数（降低风控）
task_retry = 2               ; 单集整体失败后的重试次数
ad_wait = 90                 ; 等待广告播完并取得正片流的超时（秒）
skip_existing = True         ; 产物已存在则跳过（避免重复下载/覆盖）

; ===== 清晰度偏好 =====
resolution =                   ; 留空取最佳；可指定如 1080 / 720 / 360

; ===== 网络 =====
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
proxy =                         ; 自定义代理，如 http://127.0.0.1:7890
use_system_proxy = True         ; 是否使用系统代理

; ===== 浏览器 =====
cdp_port = 9222                 ; CDP 远程调试端口（--mode cdp 时）
headless = False                ; 无头模式（True=后台无窗口运行；已适配完整 Chromium，取流正常）
nav_timeout = 60                ; 页面导航/等待超时（秒）
show_cli = True                 ; 后台运行时是否弹出 N_m3u8DL-RE 独立控制台窗口（Windows 默认开）
